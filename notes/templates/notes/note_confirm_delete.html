{% extends "base.html" %}
{% block title %}Eliminar nota{% endblock %}
{% block content %}
<div class="sn-confirm-card">
    <i class="bi bi-exclamation-triangle sn-confirm-icon"></i>
    <h1 class="h4">Eliminar nota</h1>
    <p class="text-muted">¿Confirma eliminar la nota "<strong>{{ object.title }}</strong>"?</p>
    <form method="post" class="d-flex justify-content-center gap-2 mt-3">
        {% csrf_token %}
        <a href="{% url 'notes:note-list' %}" class="btn btn-outline-secondary">Cancelar</a>
        <button type="submit" class="btn btn-danger"><i class="bi bi-trash"></i> Eliminar</button>
    </form>
</div>
{% endblock %}
