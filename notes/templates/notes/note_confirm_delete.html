{% extends "base.html" %}
{% block title %}Eliminar nota{% endblock %}
{% block content %}
<h1>Eliminar nota</h1>
<p>¿Confirma eliminar la nota "{{ object.title }}"?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Eliminar</button>
    <a href="{% url 'notes:note-list' %}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
