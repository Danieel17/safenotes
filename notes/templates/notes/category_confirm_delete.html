{% extends "base.html" %}
{% block title %}Eliminar categoría{% endblock %}
{% block content %}
<h1>Eliminar categoría</h1>
<p>¿Confirma eliminar la categoría "{{ object.name }}"?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Eliminar</button>
    <a href="{% url 'notes:category-list' %}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
