{% extends "base.html" %}
{% block title %}Categoría{% endblock %}
{% block content %}
<h1>{% if object %}Editar{% else %}Nueva{% endif %} categoría</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Guardar</button>
    <a href="{% url 'notes:category-list' %}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
