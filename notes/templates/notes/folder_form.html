{% extends "base.html" %}
{% block title %}Carpeta{% endblock %}
{% block content %}
<h1>{% if object %}Renombrar{% else %}Nueva{% endif %} carpeta</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Guardar</button>
    <a href="{% url 'notes:folder-list' %}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
