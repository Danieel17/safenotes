{% extends "base.html" %}
{% block title %}Categorías{% endblock %}
{% block content %}
<h1>Categorías</h1>
<a href="{% url 'notes:category-create' %}" class="btn btn-primary mb-3">Nueva categoría</a>
<table class="table table-striped">
    <thead>
        <tr><th>Nombre</th><th>Creado por</th><th>Acciones</th></tr>
    </thead>
    <tbody>
    {% for category in categories %}
        <tr>
            <td>{{ category.name }}</td>
            <td>{{ category.created_by }}</td>
            <td>
                <a href="{% url 'notes:category-update' category.pk %}" class="btn btn-sm btn-outline-secondary">Editar</a>
                <a href="{% url 'notes:category-delete' category.pk %}" class="btn btn-sm btn-outline-danger">Eliminar</a>
            </td>
        </tr>
    {% empty %}
        <tr><td colspan="3">No hay categorías.</td></tr>
    {% endfor %}
    </tbody>
</table>
{% endblock %}
