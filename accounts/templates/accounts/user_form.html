{% extends "base.html" %}
{% block title %}Nuevo usuario{% endblock %}
{% block content %}
<h1>Nuevo usuario</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Crear</button>
    <a href="{% url 'user-list' %}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
