{% extends "base.html" %}
{% block title %}Cambiar rol{% endblock %}
{% block content %}
<div class="card sn-card p-4" style="max-width: 480px;">
    <h1 class="h4 mb-3"><i class="bi bi-person-gear"></i> Cambiar rol de {{ target_user.username }}</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="d-flex gap-2 mt-3">
            <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Guardar</button>
            <a href="{% url 'user-list' %}" class="btn btn-outline-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
