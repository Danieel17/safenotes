{% extends "base.html" %}
{% block title %}Cambiar rol{% endblock %}
{% block content %}
<h1>Cambiar rol de {{ target_user.username }}</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Guardar</button>
    <a href="{% url 'user-list' %}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
