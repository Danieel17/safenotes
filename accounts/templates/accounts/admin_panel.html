{% extends "base.html" %}
{% block title %}Panel de administración{% endblock %}
{% block content %}
<h1 class="h3 mb-4">Panel de administración</h1>
<div class="row row-cols-1 row-cols-md-3 g-3">
    <div class="col">
        <a href="{% url 'user-list' %}" class="text-decoration-none">
            <div class="card sn-card p-3">
                <i class="bi bi-people fs-2 text-primary mb-2"></i>
                <div class="card-title mb-0">Gestión de usuarios</div>
            </div>
        </a>
    </div>
    <div class="col">
        <a href="{% url 'notes:category-list' %}" class="text-decoration-none">
            <div class="card sn-card p-3">
                <i class="bi bi-tags fs-2 text-primary mb-2"></i>
                <div class="card-title mb-0">Gestión de categorías</div>
            </div>
        </a>
    </div>
    <div class="col">
        <a href="{% url 'audit:log-list' %}" class="text-decoration-none">
            <div class="card sn-card p-3">
                <i class="bi bi-clock-history fs-2 text-primary mb-2"></i>
                <div class="card-title mb-0">Registro de auditoría</div>
            </div>
        </a>
    </div>
</div>
{% endblock %}
